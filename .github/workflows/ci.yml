name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64

    runs-on: ${{ matrix.os }}
    name: CI (${{ matrix.rid }})

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install clang (Linux)
        if: startsWith(matrix.rid, 'linux')
        run: sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: dotnet restore

      - name: Fix protoc for Linux ARM64
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get install -y protobuf-compiler
          BUNDLED_PROTOC=$(find ~/.nuget/packages/grpc.tools -name "protoc" -path "*/linux_arm64/*" 2>/dev/null | head -1)
          if [ -n "$BUNDLED_PROTOC" ]; then
            cp "$(which protoc)" "$BUNDLED_PROTOC"
          fi

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Build NativeAOT artifacts
        shell: bash
        run: ./build.sh --only cli,build_server,worker --rid ${{ matrix.rid }}
        env:
          SDKROOT: ${{ matrix.os == 'macos-latest' && '/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk' || '' }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist/cli dist/server dist/worker
          for f in build/cli/dotori build/cli/dotori.exe; do
            if [ -f "$f" ]; then cp "$f" dist/cli/; fi
          done
          for f in build/build_server/dotori-server build/build_server/dotori-server.exe; do
            if [ -f "$f" ]; then cp "$f" dist/server/; fi
          done
          for f in build/worker/dotori-worker build/worker/dotori-worker.exe; do
            if [ -f "$f" ]; then cp "$f" dist/worker/; fi
          done

  cpp-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: clang
          - os: ubuntu-latest
            compiler: g++
          - os: macos-latest
            compiler: apple-clang
          - os: windows-latest
            compiler: msvc

    runs-on: ${{ matrix.os }}
    name: C++ smoke (${{ matrix.os }}, ${{ matrix.compiler }})
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install C++ toolchains (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y clang gcc g++ lld

      - name: Restore and build Dotori CLI
        run: dotnet build src/Dotori.Cli/Dotori.Cli.csproj -c Release

      - name: Build C++ platform smoke
        run: >-
          dotnet run --project src/Dotori.Cli/Dotori.Cli.csproj
          --no-build -c Release -- build
          --project tests/platform-smoke
          --compiler ${{ matrix.compiler }}
          --timings

      - name: Run first-class test targets
        run: >-
          dotnet run --project src/Dotori.Cli/Dotori.Cli.csproj
          --no-build -c Release -- test
          --project tests/test-target-smoke
          --all
