name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64

    runs-on: ${{ matrix.os }}
    name: CI (${{ matrix.rid }})

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install clang (Linux)
        if: startsWith(matrix.rid, 'linux')
        run: sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: dotnet restore

      - name: Fix protoc for Linux ARM64
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get install -y protobuf-compiler
          BUNDLED_PROTOC=$(find ~/.nuget/packages/grpc.tools -name "protoc" -path "*/linux_arm64/*" 2>/dev/null | head -1)
          if [ -n "$BUNDLED_PROTOC" ]; then
            cp "$(which protoc)" "$BUNDLED_PROTOC"
          fi

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Build NativeAOT artifacts
        shell: bash
        run: ./build.sh --only cli,build_server,worker --rid ${{ matrix.rid }}
        env:
          SDKROOT: ${{ matrix.os == 'macos-latest' && '/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk' || '' }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist/cli dist/server dist/worker
          for f in build/cli/dotori build/cli/dotori.exe; do
            if [ -f "$f" ]; then cp "$f" dist/cli/; fi
          done
          for f in build/build_server/dotori-server build/build_server/dotori-server.exe; do
            if [ -f "$f" ]; then cp "$f" dist/server/; fi
          done
          for f in build/worker/dotori-worker build/worker/dotori-worker.exe; do
            if [ -f "$f" ]; then cp "$f" dist/worker/; fi
          done

  cpp-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            compiler: clang
          - os: macos-latest
            target: macos-arm64
            compiler: apple-clang
          - os: windows-latest
            target: windows-x64
            compiler: msvc

    runs-on: ${{ matrix.os }}
    name: C++ and IDE smoke (${{ matrix.target }})
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install C++ toolchains and Ninja (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y clang gcc g++ lld ninja-build

      - name: Restore and build Dotori CLI
        run: dotnet build src/Dotori.Cli/Dotori.Cli.csproj -c Release

      - name: Setup Python for CLI preparation smoke
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify LSP stdio protocol
        run: python tests/lsp-smoke.py --cli src/Dotori.Cli/bin/Release/net10.0/dotori.dll

      - name: Verify CLI preparation and PCH reuse
        run: >-
          python tests/cli-preparation-smoke.py
          --cli src/Dotori.Cli/bin/Release/net10.0/dotori.dll
          --compiler ${{ matrix.compiler }}

      - name: Build C++ platform smoke
        run: >-
          dotnet src/Dotori.Cli/bin/Release/net10.0/dotori.dll build
          --project tests/platform-smoke
          --compiler ${{ matrix.compiler }}
          --timings

      - name: Build C++ platform smoke with GCC
        if: runner.os == 'Linux'
        run: >-
          dotnet src/Dotori.Cli/bin/Release/net10.0/dotori.dll build
          --project tests/platform-smoke
          --compiler g++
          --timings

      - name: Build remote services for uploaded toolchain smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          dotnet build src/Dotori.BuildServer/Dotori.BuildServer.csproj -c Release
          dotnet build src/Dotori.Worker/Dotori.Worker.csproj -c Release

      - name: Verify uploaded compiler and linker (Linux)
        if: runner.os == 'Linux'
        run: >-
          python tests/remote-toolchain-smoke.py
          --cli src/Dotori.Cli/bin/Release/net10.0/dotori.dll
          --server src/Dotori.BuildServer/bin/Release/net10.0/dotori-server.dll
          --worker src/Dotori.Worker/bin/Release/net10.0/dotori-worker.dll

      - name: Run first-class test targets
        run: >-
          dotnet src/Dotori.Cli/bin/Release/net10.0/dotori.dll test
          --project tests/test-target-smoke
          --all

      - name: Generate IDE files
        run: >-
          dotnet src/Dotori.Cli/bin/Release/net10.0/dotori.dll setup ide
          --ide auto
          --project tests/platform-smoke
          --target ${{ matrix.target }}
          --compiler ${{ matrix.compiler }}

      - name: Configure generated CMake project
        working-directory: tests/platform-smoke
        run: cmake --preset ${{ matrix.target }}-debug

      - name: Build generated CMake project
        working-directory: tests/platform-smoke
        run: cmake --build --preset ${{ matrix.target }}-debug

  editor-extensions:
    runs-on: ubuntu-latest
    name: Editor extensions (VS Code, Zed, JetBrains)
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Check and package VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run check
          npm run package

      - name: Install Zed WebAssembly target
        run: rustup target add wasm32-wasip1

      - name: Verify generated Tree-sitter parser
        working-directory: editors/zed/tree-sitter-dotori
        run: |
          npx --yes tree-sitter-cli@0.26.12 generate
          npx --yes tree-sitter-cli@0.26.12 parse ../../../tests/platform-smoke/.dotori
          npx --yes tree-sitter-cli@0.26.12 query ../languages/dotori/highlights.scm ../../../tests/platform-smoke/.dotori
          git diff --exit-code -- .

      - name: Build Zed extension
        working-directory: editors/zed
        run: cargo build --locked --release --target wasm32-wasip1

      - name: Build and validate JetBrains plugin
        working-directory: editors/jetbrains
        run: >-
          ./gradlew test buildPlugin verifyPluginStructure verifyPluginProjectConfiguration
          --no-daemon --no-configuration-cache

      - name: Upload editor extension artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dotori-editor-extensions
          path: |
            editors/vscode/*.vsix
            editors/zed/target/wasm32-wasip1/release/*.wasm
            editors/jetbrains/build/distributions/*.zip
          if-no-files-found: error

  visual-studio-extension:
    runs-on: windows-latest
    name: Visual Studio extension
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build Visual Studio VSIX
        run: dotnet build editors/visualstudio/Dotori.VisualStudio.csproj -c Release

      - name: Upload Visual Studio VSIX
        uses: actions/upload-artifact@v7
        with:
          name: dotori-visual-studio-extension
          path: editors/visualstudio/bin/Release/net472/*.vsix
          if-no-files-found: error
