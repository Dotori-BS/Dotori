services:
  worker1:
    build:
      context: .
      dockerfile: src/Dotori.Worker/Dockerfile
    environment:
      - DOTORI_WORKER_TOKEN=${DOTORI_WORKER_TOKEN:?set DOTORI_WORKER_TOKEN}

  worker2:
    build:
      context: .
      dockerfile: src/Dotori.Worker/Dockerfile
    environment:
      - DOTORI_WORKER_TOKEN=${DOTORI_WORKER_TOKEN:?set DOTORI_WORKER_TOKEN}

  server:
    build:
      context: .
      dockerfile: src/Dotori.BuildServer/Dockerfile
    ports:
      - "5100:5100"
    environment:
      - DOTORI_WORKERS=http://worker1:5100,http://worker2:5100
      - DOTORI_SERVER_TOKEN=${DOTORI_SERVER_TOKEN:?set DOTORI_SERVER_TOKEN}
      - DOTORI_WORKER_TOKEN=${DOTORI_WORKER_TOKEN:?set DOTORI_WORKER_TOKEN}
    depends_on:
      - worker1
      - worker2

  registry:
    image: verdaccio/verdaccio:6.2.1
    profiles: ["registry"]
    ports:
      - "4873:4873"
    volumes:
      - ./deploy/registry/config.yaml:/verdaccio/conf/config.yaml:ro
      - ${DOTORI_REGISTRY_HTPASSWD_FILE:-./deploy/registry/htpasswd.example}:/verdaccio/auth/htpasswd:ro
      - registry-data:/verdaccio/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4873/-/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  registry-data:
